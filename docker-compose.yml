services:
  nasdocker:
    build:
      context: .
    image: nasdocker:local
    container_name: nasdocker
    restart: unless-stopped
    ports:
      - "${NASDOCKER_PORT:-3080}:3000"
    environment:
      ADMIN_USERNAME: "${NASDOCKER_USERNAME:-admin}"
      ADMIN_PASSWORD: "${NASDOCKER_PASSWORD:?请在 .env 中设置 NASDOCKER_PASSWORD}"
      UPDATE_CACHE_MINUTES: "${UPDATE_CACHE_MINUTES:-10}"
      UPDATE_PULL_TIMEOUT_SECONDS: "${UPDATE_PULL_TIMEOUT_SECONDS:-120}"
      UPDATE_CHECK_PROXY: "${UPDATE_CHECK_PROXY:-}"
      UPDATE_CHECK_NO_PROXY: "${UPDATE_CHECK_NO_PROXY:-localhost,127.0.0.1}"
      HOST_DOCKER_CONFIG_PATH: "${HOST_DOCKER_CONFIG_PATH:-/etc/docker/daemon.json}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_HOST_DIR:-./compose-files}:/composeFile
      - nasdocker-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  nasdocker-data:
