services:
  docker-manager:
    image: projectdown/docker-manager:latest
    container_name: docker-manager
    restart: unless-stopped

    ports:
      - "${DOCKER_MANAGER_PORT:-3102}:3000"

    environment:
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}"
      MANAGER_CONTAINER_NAME: "docker-manager"
      UPDATE_CACHE_MINUTES: "${UPDATE_CACHE_MINUTES:-10}"
      UPDATE_CHECK_TIMEOUT_SECONDS: "${UPDATE_CHECK_TIMEOUT_SECONDS:-30}"
      UPDATE_PULL_TIMEOUT_SECONDS: "${UPDATE_PULL_TIMEOUT_SECONDS:-900}"
      MIRROR_BENCHMARK_TIMEOUT_SECONDS: "${MIRROR_BENCHMARK_TIMEOUT_SECONDS:-8}"
      UPDATE_CHECK_PROXY: "${UPDATE_CHECK_PROXY:-}"
      UPDATE_CHECK_NO_PROXY: "${UPDATE_CHECK_NO_PROXY:-localhost,127.0.0.1}"
      HOST_DOCKER_CONFIG_PATH: "${HOST_DOCKER_CONFIG_PATH:-/etc/docker/daemon.json}"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_HOST_DIR:-/opt/docker-manager/compose-files}:/composeFile
      - docker-manager-data:/data

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

volumes:
  docker-manager-data:
